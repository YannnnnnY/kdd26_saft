### model
model_name_or_path: null
aligned_model_name_or_path: null
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all
lora_dropout: 0.1

### dataset
dataset_dir: saft/.data
dataset: gsm8k
template: null
benign_num: 1800
# max_samples: 1000

unaligned_dataset: beavertails_unaligned
unaligned_template: null
unaligned_ratio: 0.1

aligned_dataset: beavertails_aligned
aligned_num: 100
aligned_template: null
aligned_ratio: 1.0

cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: null
logging_steps: 1
save_strategy: epoch
#save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: swanlab


### train
rho: 1.0
projection: True

per_device_train_batch_size: 16
gradient_accumulation_steps: 1

per_device_align_batch_size: 16
align_gradient_accumulation_steps: 1

learning_rate: 1.0e-5
num_train_epochs: 3.0
max_steps: -1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
